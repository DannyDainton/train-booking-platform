id: 019e836d-1864-7741-8ce1-e78eb1cbabb1
simulation: OpenWeather Faults
routing: header
mocks:
  - file: ../mocks/openweather-mock.js
    scenarios:
      - type: delay
        config:
          delay_ms: 6000
          path: /data/2.5/weather
          method: GET
          scenario_name: slow_response
      - type: error
        config:
          status_code: 429
          path: /data/2.5/weather
          method: GET
          scenario_name: rate_limited
          body:
            cod: 429
            message: >-
              Your account is temporary blocked due to exceeding of requests limitation of your subscription type.
              Please choose the proper subscription https://openweathermap.org/price
      - type: error
        config:
          status_code: 500
          path: /data/2.5/weather
          method: GET
          scenario_name: server_error
          body:
            cod: 500
            message: Internal server error
      - type: error
        config:
          status_code: 200
          path: /data/2.5/weather
          method: GET
          scenario_name: malformed_response
          body:
            unexpected: shape
            weather: null

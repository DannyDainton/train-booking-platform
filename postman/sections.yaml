panels:
  - name: collections
    panelType: 1
    items:
      - relativePath: postman/collections/Booking E2E Flow
        elementType: collection
      - relativePath: postman/collections/Booking Service
        elementType: collection
      - relativePath: postman/collections/Notification Service
        elementType: collection
      - relativePath: postman/collections/Payment Service
        elementType: collection
      - relativePath: postman/collections/Schedule Service
        elementType: collection
      - relativePath: postman/collections/Weather Service
        elementType: collection
  - name: environments
    panelType: 1
    items:
      - relativePath: postman/environments/Booking Platform Environment.environment.yaml
        elementType: environment
  - name: docs
    panelType: 1
  - name: uncategorized
    panelType: 1
    isUncategorized: true
    items:
      - relativePath: postman/mocks/notification-mock.json
        elementType: codeMock
      - relativePath: postman/mocks/openweather-mock.json
        elementType: codeMock
      - relativePath: postman/mocks/payment-mock.json
        elementType: codeMock
      - relativePath: postman/mocks/schedule-mock.json
        elementType: codeMock
  - name: mocks
    panelType: 2
  - name: uncategorized
    panelType: 2
    isUncategorized: true
    items:
      - relativePath: postman/simulations/openweather-faults.sim.yaml
        elementType: simulation
      - relativePath: postman/simulations/response-delay.sim.yaml
        elementType: simulation
      - relativePath: postman/simulations/schedule-bad-request.sim.yaml
        elementType: simulation

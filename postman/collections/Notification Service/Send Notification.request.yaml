$kind: http-request
method: POST
url: '{{baseUrl}}/notifications'
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "type": "booking_confirmation",
        "recipient": "Alice Smith",
        "bookingRef": "BR-TEST0001",
        "details": {
            "train": {
                "trainId": "T100",
                "operator": "Northern Rail",
                "from": "London Euston",
                "to": "Manchester Piccadilly",
                "date": "2026-11-12",
                "departure": "08:15",
                "arrival": "10:25"
            },
            "passengers": [
                { "name": "Alice Smith" },
                { "name": "Bob Jones" }
            ],
            "totalAmount": 90,
            "currency": "GBP"
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => {
          pm.response.to.have.status(201);
      });

      pm.test("Notification has an ID with NTF- prefix", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("notificationId");
          pm.expect(res.notificationId).to.match(/^NTF-/);
      });

      pm.test("Notification echoes request fields", () => {
          const res = pm.response.json();
          pm.expect(res.type).to.eql("booking_confirmation");
          pm.expect(res.recipient).to.eql("Alice Smith");
          pm.expect(res.bookingRef).to.eql("BR-TEST0001");
      });

      pm.test("Status is sent and createdAt is present", () => {
          const res = pm.response.json();
          pm.expect(res.status).to.eql("sent");
          pm.expect(res).to.have.property("createdAt");
      });

      pm.test("Default message was generated", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("message");
          pm.expect(res.message).to.be.a("string").and.not.empty;
      });

      pm.test("Details are preserved", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("details");
          pm.expect(res.details).to.have.property("train");
          pm.expect(res.details.totalAmount).to.eql(90);
          pm.expect(res.details.currency).to.eql("GBP");
      });
    language: text/javascript

$kind: http-request
name: Send Weather Alert
method: POST
url: '{{baseUrl}}/notifications'
order: 1500
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "type": "weather_alert",
        "recipient": "Alice Smith",
        "bookingRef": "BR-TEST0001",
        "message": "Weather alert for Manchester on your travel day: Severe weather — check for service disruption before travelling.",
        "details": {
            "destination": "Manchester",
            "conditions": {
                "summary": "Thunderstorm",
                "description": "thunderstorm with heavy rain",
                "category": "severe"
            },
            "temperature": {
                "current": 8.2,
                "feelsLike": 5.1,
                "min": 7.0,
                "max": 10.0,
                "unit": "C"
            },
            "wind": {
                "speed": 17.5,
                "unit": "m/s"
            },
            "travelAdvisory": {
                "level": "warning",
                "message": "Severe weather — check for service disruption before travelling."
            },
            "train": {
                "trainId": "T100",
                "operator": "Northern Rail",
                "from": "London Euston",
                "to": "Manchester Piccadilly",
                "date": "2026-04-25",
                "departure": "08:15",
                "arrival": "10:25"
            }
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => {
          pm.response.to.have.status(201);
      });

      pm.test("Notification is a weather_alert", () => {
          const res = pm.response.json();
          pm.expect(res.type).to.eql("weather_alert");
      });

      pm.test("Notification has an ID with NTF- prefix", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("notificationId");
          pm.expect(res.notificationId).to.match(/^NTF-/);
      });

      pm.test("Recipient and bookingRef are echoed", () => {
          const res = pm.response.json();
          pm.expect(res.recipient).to.eql("Alice Smith");
          pm.expect(res.bookingRef).to.eql("BR-TEST0001");
      });

      pm.test("Custom message is preserved", () => {
          const res = pm.response.json();
          pm.expect(res.message).to.include("Weather alert for Manchester");
      });

      pm.test("Weather details are preserved", () => {
          const res = pm.response.json();
          pm.expect(res.details).to.have.property("destination", "Manchester");
          pm.expect(res.details.conditions.category).to.eql("severe");
          pm.expect(res.details.travelAdvisory.level).to.eql("warning");
          pm.expect(res.details).to.have.property("train");
      });

      pm.test("Status is sent", () => {
          const res = pm.response.json();
          pm.expect(res.status).to.eql("sent");
      });
    language: text/javascript

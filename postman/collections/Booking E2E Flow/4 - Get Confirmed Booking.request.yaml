$kind: http-request
name: 4 - Get Confirmed Booking
method: GET
url: '{{baseUrl}}/bookings/{{bookingRef}}'
order: 4000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Booking is confirmed", () => {
          const res = pm.response.json();
          pm.expect(res.status).to.equal("confirmed");
      });

      pm.test("Booking ref is correct", () => {
          const res = pm.response.json();
          const expectedRef = pm.collectionVariables.get("bookingRef");
          pm.expect(res.bookingRef).to.equal(expectedRef);
      });

      pm.test("Payment info is persisted", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("payment");
          const expectedTxn = pm.collectionVariables.get("transactionId");
          pm.expect(res.payment.transactionId).to.equal(expectedTxn);
          pm.expect(res.payment.status).to.equal("confirmed");
      });

      pm.test("Full booking structure is intact", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("bookingRef");
          pm.expect(res).to.have.property("status");
          pm.expect(res).to.have.property("train");
          pm.expect(res).to.have.property("seatClass");
          pm.expect(res).to.have.property("passengers");
          pm.expect(res).to.have.property("totalAmount");
          pm.expect(res).to.have.property("currency");
          pm.expect(res).to.have.property("createdAt");
          pm.expect(res).to.have.property("payment");
      });

      pm.test("All passengers have complete details", () => {
          const res = pm.response.json();
          res.passengers.forEach(p => {
              pm.expect(p).to.have.property("passenger");
              pm.expect(p).to.have.property("seat");
              pm.expect(p).to.have.property("seatClass");
              pm.expect(p).to.have.property("price");
          });
      });

      pm.test("Response time is acceptable", () => {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      console.log("E2E flow complete! Booking", pm.response.json().bookingRef, "is confirmed.");
    language: text/javascript

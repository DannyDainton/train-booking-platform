$kind: http-request
name: Search Trains
method: GET
url: '{{baseUrl}}/schedules'
order: 1000
queryParams:
  - key: from
    value: London
  - key: to
    value: Edinburgh
  - key: date
    value: '2026-04-01'
    disabled: true
  - key: seatClass
    value: first
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();

      if (res.results && res.results.length > 0) {
          console.log(`\n🚆 Found ${res.count} train(s):\n`);

          res.results.forEach(train => {
              console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
              console.log(`🚂 ${train.trainId} — ${train.operator}`);
              console.log(`   ${train.from} → ${train.to}`);
              console.log(`   📅 ${train.date}  🕐 ${train.departure} → ${train.arrival} (${train.duration})`);
              console.log(`   💺 Seat Classes:`);
              if (train.seats) {
                  console.log(`      Standard : £${train.seats.standard.price.toFixed(2)} (${train.seats.standard.available} available)`);
                  console.log(`      First    : £${train.seats.firstClass.price.toFixed(2)} (${train.seats.firstClass.available} available)`);
              } else {
                  console.log(`      General  : £${train.price.toFixed(2)} (${train.seatsAvailable} available)`);
              }
          });

          console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);
      } else {
          console.log('No trains found for the given search criteria.');
      }
    language: text/javascript
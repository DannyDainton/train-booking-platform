$kind: http-request
name: Search Trains
method: GET
url: '{{baseUrl}}/schedules'
order: 1000
queryParams:
  - key: from
    value: London
  - key: to
    value: Edinburgh
  - key: date
    value: '2026-07-08'
    disabled: true
  - key: seatClass
    value: first
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Response has count and results", () => {
          const res = pm.response.json();
          pm.expect(res).to.have.property("count");
          pm.expect(res).to.have.property("results");
          pm.expect(res.results).to.be.an("array");
          pm.expect(res.count).to.eql(res.results.length);
      });

      pm.test("Train results have required properties", () => {
          const res = pm.response.json();
          res.results.forEach(train => {
              pm.expect(train).to.have.property("trainId");
              pm.expect(train).to.have.property("operator");
              pm.expect(train).to.have.property("from");
              pm.expect(train).to.have.property("to");
              pm.expect(train).to.have.property("date");
              pm.expect(train).to.have.property("departure");
              pm.expect(train).to.have.property("arrival");
              pm.expect(train).to.have.property("duration");
              pm.expect(train).to.have.property("seats");
              pm.expect(train.seats).to.have.property("standard");
              pm.expect(train.seats).to.have.property("firstClass");
          });
      });

      pm.test("Results match the from/to search query", () => {
          const res = pm.response.json();
          res.results.forEach(train => {
              pm.expect(train.from.toLowerCase()).to.include("london");
              pm.expect(train.to.toLowerCase()).to.include("edinburgh");
          });
      });

      const res = pm.response.json();

      if (res.results && res.results.length > 0) {
          console.log(`\n🚆 Found ${res.count} train(s):\n`);

          res.results.forEach(train => {
              console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
              console.log(`🚂 ${train.trainId} — ${train.operator}`);
              console.log(`   ${train.from} → ${train.to}`);
              console.log(`   📅 ${train.date}  🕐 ${train.departure} → ${train.arrival} (${train.duration})`);
              console.log(`   💺 Seat Classes:`);
              if (train.seats) {
                  console.log(`      Standard : £${train.seats.standard.price.toFixed(2)} (${train.seats.standard.available} available)`);
                  console.log(`      First    : £${train.seats.firstClass.price.toFixed(2)} (${train.seats.firstClass.available} available)`);
              } else {
                  console.log(`      General  : £${train.price.toFixed(2)} (${train.seatsAvailable} available)`);
              }
          });

          console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);
      } else {
          console.log('No trains found for the given search criteria.');
      }
    language: text/javascript

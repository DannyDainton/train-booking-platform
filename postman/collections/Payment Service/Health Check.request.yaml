$kind: http-request
method: GET
url: '{{baseUrl}}/ping'
order: 4000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Service reports ok status", () => {
          const res = pm.response.json();
          pm.expect(res.status).to.eql("ok");
      });

      pm.test("Service name is payment", () => {
          const res = pm.response.json();
          pm.expect(res.service).to.eql("payment");
      });
    language: text/javascript
